server {
    listen 80;
    server_name zaryn.movies www.zaryn.movies;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver for proxy_pass to external hosts
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/rss+xml
        font/woff2;

    # sitemap.xml: proxy directly to the Supabase Edge Function.
    # Returns live XML from the database on every request — no static file, no rebuilds.
    location = /sitemap.xml {
        proxy_pass https://zjlsmwcrenzdvdkfyhdx.supabase.co/functions/v1/generate-sitemap;
        proxy_set_header Host zjlsmwcrenzdvdkfyhdx.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cache the sitemap for 1 hour at the nginx level (crawlers don't need sub-minute freshness)
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Static assets: 1 year cache (hashed by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Fonts: 1 year cache
    location ~* \.(woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Images: 30 days cache
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Service worker: no cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # index.html: never cache (SPA entry)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}